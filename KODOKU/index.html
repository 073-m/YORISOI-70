<!DOCTYPE html>
<html>
<head>

    <title>YORISOI70</title>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    

    <!--左上UI-->
    <style>
        body { margin: 0; overflow: hidden; }
        #ui {
            position: absolute; top: 15px; left: 15px;
            z-index: 1000;
            background: rgba(42, 42, 42, 0.7);
            color: white; padding: 10px;
            border-radius: 10px;
            font-family: sans-serif;
        }
        input[type="file"] {
            width: 220px; padding: 2px;
        }
        button {
            padding: 6px 8px; margin: 1px;
        }
    </style>


    <script>
        // 星空
        AFRAME.registerComponent('starry-sky', {
            schema: {
                count: {type: 'number', default: 700},
                radius: {type: 'number', default: 90}
            },
            init: function () {
                const el = this.el;
                const data = this.data;
                for (let i = 0; i < data.count; i++) {
                    const star = document.createElement('a-sphere');
                    star.setAttribute('radius', Math.random() * 0.05 + 0.02);
                    star.setAttribute('color', '#FFFFFF');

                    // 星の発光
                    star.setAttribute('material', 'shader: flat; emissive: #FFFFFF; emissiveIntensity: 1.0;');
                
                    const u = Math.random();
                    const v = Math.random();
                    const theta = 2 * Math.PI * u;
                    const phi = Math.acos(2 * v - 1);
                    const x = data.radius * Math.sin(phi) * Math.cos(theta);
                    const y = data.radius * Math.sin(phi) * Math.sin(theta);
                    const z = data.radius * Math.cos(phi);
                    star.setAttribute('position', `${x} ${y} ${z}`);
                    el.appendChild(star);
                }
            }
        });
        

        // 雨
        AFRAME.registerComponent('rain', {
            schema: {
                count: {type: 'number', default: 500},
                area: {type: 'number', default: 30},
                roomDepth: {type: 'number', default: 6.5}
            },
            init: function () {
                const el = this.el;
                const data = this.data;
                for (let i = 0; i < data.count; i++) {
                    const rainDrop = document.createElement('a-box');
                    rainDrop.setAttribute('color', '#ADD8E6');
                    rainDrop.setAttribute('width', 0.01);
                    rainDrop.setAttribute('height', 0.15);
                    rainDrop.setAttribute('depth', 0.01);
                
                    let x, y, z;
                
                    do {   
                        x = Math.random() * data.area - data.area / 2;
                        z = Math.random() * data.area - data.area / 2;
                    } while (x > -3 && x < 3 && z > -3 - data.roomDepth / 2 && z < -3 + data.roomDepth / 2);
                    y = Math.random() * 10 + 10;
                
                    rainDrop.setAttribute('position', `${x} ${y} ${z}`);
                    rainDrop.setAttribute('animation__fall', {
                        property: 'position',
                        to: `${x} 0 ${z}`,
                        dur: Math.random() * 1500 + 1500,
                        loop: true,
                        easing: 'linear'
                    });
                    el.appendChild(rainDrop);
                }
            }
        });



        //　★★★　時計　★★★
        AFRAME.registerComponent('clock', {

            init: function () {
                // 空と星の要素を見つける
                this.skyEl = document.getElementById('sky-element');
                this.starsEl = document.getElementById('stars-element');
            },

            tick: function () {
                const el = this.el;
                const now = new Date();

                // 時計
                const jst_time = now.toLocaleString("ja-JP", {
                    timeZone: "Asia/Tokyo",
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                // 日付
                const jst_date = now.toLocaleString("ja-JP",{
                    timeZone: "Asia/Tokyo",
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                // 曜日
                const jst_weekday = now.toLocaleString("en-US",{
                    timeZone: "Asia/Tokyo",
                    weekday: 'long'
                });

                const display_text = jst_time + '\n' + jst_date + ' ' + jst_weekday
                el.setAttribute('value', display_text);


                // 空の色制御
                const hour = now.getHours();            // 時間の情報取得
                let skyColor = "#212133";               // デフォルト（夜）
                let starsVisible = true;

                if (hour >= 6 && hour < 10) {           // 朝 (6時〜9時台)
                    skyColor = "#87CEEB";               // 明るい空色
                    starsVisible = false;

                } else if (hour >= 10 && hour < 16) {   // 昼 (10時〜15時台)
                    skyColor = "#4682B4";　　　         // 濃い空色
                    starsVisible = false;

                } else if (hour >= 16 && hour < 19) {　　// 夕方 (16時〜18時台)
                    skyColor = "#FF7F50";                // 夕焼け色
                    starsVisible = true;

                } else {                                // 夜 (19時〜翌5時台)
                    skyColor = "#212133";                // デフォルトの夜の色
                    starsVisible = true;
                }

                // 取得した空と星に、計算した色と表示状態を適用させる
                if (this.skyEl) {
                    this.skyEl.setAttribute('color', skyColor);
                }
                if (this.starsEl) {
                    this.starsEl.setAttribute('visible', starsVisible);
                }

            }
        });


        // 雨音制御
        AFRAME.registerComponent('audio-control', {
            init: function () {
                const audioEl = document.getElementById('rain-audio');
                audioEl.volume = 0.5;
                this.el.sceneEl.addEventListener('enter-vr', function () { audioEl.play(); });
            }
        });




        // ★★　ライトスイッチ
        AFRAME.registerComponent('light-switch', {
            init: function () {
                const lightEl = document.getElementById('room-light');
                const switchEl = this.el;

                let lightIsOn = true;

                if (lightEl) {
                    switchEl.addEventListener('click', function () {
                        if (lightIsOn) {
                            lightEl.setAttribute('light', 'intensity', 0.09); // OFF
                        } else {
                            lightEl.setAttribute('light', 'intensity', 0.35); // ON (元の明るさ)
                        }
                        lightIsOn = !lightIsOn;
                    });
                }
            }
        });




        // ★★　雨音スイッチ
        AFRAME.registerComponent('rain-switch', {
            init: function () {
                const audioEl = document.getElementById('rain-audio');
                const visualEl = document.getElementById('rain-visual');　// 雨の見た目
                const switchEl = this.el;
                let isPlaying = true;

                switchEl.addEventListener('click', function () {
                    if (isPlaying) {
                        // 雨を止める処理
                        audioEl.pause();
                        visualEl.setAttribute('visible', false);　// 雨非表示
                    } else {
                        // 雨再生する処理
                        audioEl.play();
                        visualEl.setAttribute('visible', true);
                    }
                    isPlaying = !isPlaying;
                });
            }
        });




        // ★★　動画再生
        AFRAME.registerComponent('user-video-control', {
            init: function() {
                const videoEl = document.getElementById('user-video-texture'); 
                const fileInput = document.getElementById('video-file-input');
                const playButton = document.getElementById('video-play-button');
                const stopButton = document.getElementById('video-stop-button');

                fileInput.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        const fileURL = URL.createObjectURL(file);
                        videoEl.src = fileURL;
                        videoEl.load();
                        videoEl.play();
                    }
                });

                playButton.addEventListener('click', () => {
                    videoEl.play();
                });

                stopButton.addEventListener('click', () => {
                    videoEl.pause();
                });
            }
        });




        // ★★　クリックで椅子とベッドにテレポート
        AFRAME.registerComponent('teleport-on-click', {
            schema: {
                // 'targetPos' という名前で、移動先の座標を受け取る
                targetPos: {type: 'vec3', default: {x: 0, y: 1, z: 0}}
            },
            init: function () {
                // カメラ(プレイヤー)を探しておく
                const cameraRig = document.querySelector('a-entity[camera]');
                
                // このコンポーネントが付けられた要素(this.el)がクリックされた時...
                this.el.addEventListener('click', () => {
                    // カメラの位置(position)を、指定された座標(targetPos)に変更する
                    cameraRig.setAttribute('position', this.data.targetPos);
                });
            }
        });




        // ★★　カラー変更スイッチ機能
        AFRAME.registerComponent('color-switch', {
            // 3つの色のテーマを定義
            themes: [
                { floor: '#2f5d50', wall: '#3b7960', furnitureA: '#98605e', furnitureB: '#c0c0c0' }, // (緑/赤)
                { floor: '#6b4f34', wall: '#8b6b49', furnitureA: '#b08a5b', furnitureB: '#f0e68c' }, // (茶/黄)
                { floor: '#4a4266', wall: '#5c527f', furnitureA: '#7f78a0', furnitureB: '#a9a2c4' }  // (紫/ラベンダー)
            ],

            init: function () {
                this.currentTheme = 0; // 現在のテーマ番号
                this.elements = { // 色を変える要素をすべて探しておく
                    floor: document.querySelectorAll('.themable-floor'),
                    wall: document.querySelectorAll('.themable-wall'),
                    furnitureA: document.querySelectorAll('.themable-furnitureA'),
                    furnitureB: document.querySelectorAll('.themable-furnitureB'),
                    desk: document.querySelector('.themable-desk')
                };

                // 最初のテーマ（デフォルト）を適用する
                this.applyTheme();

                // スイッチがクリックされた時の処理
                this.el.addEventListener('click', () => {
                    // 次のテーマ番号に進める
                    this.currentTheme = (this.currentTheme + 1) % this.themes.length;
                    // 色を適用する
                    this.applyTheme();
                });
            },

            // 色を適用する関数
            applyTheme: function () {
                const theme = this.themes[this.currentTheme];
                this.elements.floor.forEach(el => el.setAttribute('color', theme.floor));
                this.elements.wall.forEach(el => el.setAttribute('color', theme.wall));
                this.elements.furnitureA.forEach(el => el.setAttribute('color', theme.furnitureA));
                this.elements.furnitureB.forEach(el => el.setAttribute('color', theme.furnitureB));

                // 机は色と透明度を両方設定する
                if (this.elements.desk) {
                    this.elements.desk.setAttribute('material', {
                        color: theme.desk,
                        opacity: 0.8, // 透明度
                        transparent: true
                    });
                }
            }
        });




        // ★★★ 光る観葉植物 ★★★
        AFRAME.registerComponent('plant-light-switch', {
            init: function () {
                const lightSource = document.getElementById('plant-light-source');
                const plantSphere = document.getElementById('glowing-plant-sphere');
                let isPlantOn = false;

                this.el.addEventListener('click', () => {
                    if (isPlantOn) {
                        lightSource.setAttribute('light', 'intensity', 0);
                        plantSphere.setAttribute('material', 'emissiveIntensity', 0.2);
                    } else {
                        lightSource.setAttribute('light', 'intensity', 1.5);
                        plantSphere.setAttribute('material', 'emissiveIntensity', 1.0);
                    }
                    isPlantOn = !isPlantOn;
                });
            }
        });

    </script>
</head>


<!-------------------------------------------------------------->


<body>

    <!--★★★　動画再生ボックスUI　★★★-->
    <div id="ui">
        <div>🎞️⭐ 動画を再生 ⭐🎞️</div>
        <input type="file" id="video-file-input" accept="video/mp4,video/webm">
        <button id="video-play-button"> ▶️再生 </button>
        <button id="video-stop-button"> ⏸️停止 </button>
    </div>



    <a-scene audio-control user-video-control　color-switch>
    
        <!--★★★　動画のループ・雨音音声のループ　★★★-->
        <a-assets>
            <video id="user-video-texture" src="" autoplay="false" loop="true" crossorigin="anonymous"></video>
            <audio id="rain-audio" src="rain.mp3" loop></audio>
        </a-assets>



        <!--★★★　カメラ　★★★-->
        <a-entity
            camera look-controls wasd-controls="acceleration: 25"
            position="0.0 1.0 -2.0">
            <!-- 照準カーソル -->
            <a-cursor
                color="999999"
                raycaster="objects: .clickable; far: 4.0;">
            </a-cursor>
        </a-entity>



        <!--★★★　部屋全体の明かり　★★★-->
        <a-light id="room-light" type="ambient" color="#fff" intensity="0.35"></a-light>
        


        <!--★★★　空　★★★-->
        <a-sky
            id="sky-element"
            color="#212133"
            material="shader: flat;">
        </a-sky>



        <!--★★★　星の数・半径　★★★-->
        <a-entity
            id="stars-element"
            starry-sky="count: 700; radius: 90;">
        </a-entity>



        <!--雨の量・エリア範囲-->
        <a-entity
            id="rain-visual"
            rain="count: 500; area: 20; roomDepth: 6.5;">
        </a-entity>



        <!--★★-----床------->
        <a-box
            position="0 0 -3"
            width="6" height="0.1" depth="6"
            class="themable-floor">
        </a-box>
        <!-------天井------->
        <a-box
            position="0 3 -3"
            width="6" height="0.1" depth="6"
            material="color: #c1d8ac; opacity: 0.2; transparent: true;">
        </a-box>
        <!-------奥の壁------->
        <a-box
            position="0 1.5 -6"
            width="6" height="3" depth="0.1"
            class="themable-wall">
        </a-box>
        <!-------左の壁------->
        <a-box
            position="-3 1.5 -3"
            width="0.1" height="3" depth="6"
            class="themable-floor">
        </a-box>
        <!-------右の壁------->
        <a-box
            position="3 1.5 -3"
            width="0.1" height="3" depth="6"
            class="themable-floor">
        </a-box>
        <!-------手前の壁------->
        <a-box
            position="0 1.5 0"
            width="6" height="3" depth="0.1"
            class="themable-wall">
        </a-box>



        <!--★★-----ベッド------->
        <a-box
            id="bed"
            position="-1.8 0.2 -1.5"
            width="2"
            height="0.5"
            depth="2.8"
            class="clickable themable-furnitureA"
            teleport-on-click="targetPos: -1.8 0.8 -1.5">
        </a-box>
        <!-------枕------->
        <a-box
            id="makura"
            position="-1.8 0.5 -2.5"
            width="1.5"
            height="0.3"
            depth="0.5"
            class="themable-furnitureB">
        </a-box>
    


        <!--時計-->
        <a-text
            id="clock-text"
            value="00:00:00"
            position="0.6 0.4 -5.85"
            width="4.0"
            color="#7a9990"
            clock>
        </a-text>



        <!--★★-----机------->
        <a-box
            id="table"
            position="0.0 0.0 -4.5"
            width="3.0"
            height="1.0"
            depth="1"
            material="opacity: 0.8; transparent: true;"
            class="themable-desk">
        </a-box>
        <!-------椅子的なもの------->
        <a-box
            id="chair"
            position="0 0.1 -3.7"
            width="1.7" height="0.4" depth="0.03"
            rotation="-90 0 0"
            class="clickable themable-furnitureB"
            teleport-on-click="targetPos: 0.0 0.8 -3.9">
        </a-box>



        <!--★★-----ライトスイッチ------->
        <a-box id="light-switch" position="2.5 1.3 -5.9" width="0.1" height="0.15" depth="0.08" color="d2b48c" light-switch class="clickable"></a-box>
        <a-text value="LIGHT | on/off |" position="2.5 1.5 -5.9" width="1.5" color="#c0c0c0" align="center"></a-text>
        


        <!--★★ 光る観葉植物 ★★★ -->
        <a-entity position="2.5 0 -0.7">
            <!-- 植木鉢 -->
            <a-cylinder
                radius="0.3" height="1"
                color="#856859">
            </a-cylinder>
            <!-- 植物 -->
            <a-sphere
                id="glowing-plant-sphere" 
                position="0 0.9 0" 
                radius="0.3" 
                color="#769164" 
                material="emissive: #769164; emissiveIntensity: 0.2"
                class="clickable"
                plant-light-switch>

                <!-- ★ 植物の中の光源 -->
                <a-light
                    id="plant-light-source"
                    type="point"
                    color="#a3d6cc"
                    intensity="0"
                    position="0 0.9 0">
                </a-light>
            </a-sphere>
        </a-entity>


        <!-------雨音スイッチ------->
        <a-box id="rain-switch" position="2.5 1.1 -5.9" width="0.1" height="0.15" depth="0.08" color="#84a2d4" rain-switch class="clickable"></a-box>
        <a-text value="RAIN | on/off |" position="2.5 0.95 -5.9" width="1.5" color="#c0c0c0" align="center"></a-text>
        <!-------カラースイッチ------->
        <a-box id="color-switch" position="2.5 0.7 -5.9" width="0.1" height="0.15" depth="0.08" color="#f0e68c" color-switch class="clickable"></a-box>
        <a-text value="Color | change |" position="2.5 0.55 -5.9" width="1.5" color="#c0c0c0" align="center"></a-text>



        <!--★★--------------------------------------- 観葉植物 ------->
            <!--a-sphere 
                position="0 1.4 0" 
                radius="0.3" 
                color="#769164">
            </a-sphere>
        </a-entity>



        <!-動画再生画面-->
        <a-plane
            id="videoScreen"
            geometry="primitive: plane; height: 2.2; width: 3.7"
            position="0 1.7 -5.9"
            material="src: #user-video-texture; side: double;">
        </a-plane>



        <!-- ★★★ 木 ★★★ -->
        <a-entity id="forest-area">
            <!-- 奥の木 -->
            <a-entity position="0 0 -10">
                <a-entity position="-8 0 0" scale="1.5 1.5 1.5"> <a-cylinder color="#5D4037" radius="0.2" height="3"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="1" height="4" position="0 3 0"></a-cone> </a-entity>
                <a-entity position="-4 0 -2" scale="1 1 1"> <a-cylinder color="#5D4037" radius="0.2" height="2"></a-cylinder> <a-cone color="#3b7960" radius-bottom="0.8" height="3" position="0 2 0"></a-cone> </a-entity>
                <a-entity position="0 0 1" scale="1.8 1.8 1.8"> <a-cylinder color="#5D4037" radius="0.2" height="4"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="0.8" height="3" position="0 2 0"></a-cone> </a-entity>
                <a-entity position="5 0 -1" scale="1.2 1.2 1.2"> <a-cylinder color="#5D4037" radius="0.2" height="2.5"></a-cylinder> <a-cone color="#3b7960" radius-bottom="1" height="3.5" position="0 2.5 0"></a-cone> </a-entity>
                <a-entity position="9 0 0" scale="1.5 1.5 1.5"> <a-cylinder color="#5D4037" radius="0.2" height="3"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="1" height="4" position="0 3 0"></a-cone> </a-entity>
            </a-entity>
            <!-- 左の木 -->
            <a-entity position="-10 0 0" rotation="0 90 0">
                <a-entity position="-5 0 0" scale="1.5 1.5 1.5"> <a-cylinder color="#5D4037" radius="0.2" height="3"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="1" height="4" position="0 3 0"></a-cone> </a-entity>
                <a-entity position="0 0 1" scale="1.8 1.8 1.8"> <a-cylinder color="#5D4037" radius="0.2" height="4"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="1.2" height="5" position="0 4 0"></a-cone> </a-entity>
                <a-entity position="4 0 -1" scale="1.2 1.2 1.2"> <a-cylinder color="#5D4037" radius="0.2" height="2.5"></a-cylinder> <a-cone color="#3b7960" radius-bottom="1" height="3.5" position="0 2.5 0"></a-cone> </a-entity>
            </a-entity>
            <!-- 右の木 -->
            <a-entity position="10 0 0" rotation="0 -90 0">
                <a-entity position="-6 0 0" scale="1.5 1.5 1.5"> <a-cylinder color="#5D4037" radius="0.2" height="3"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="1" height="4" position="0 3 0"></a-cone> </a-entity>
                <a-entity position="-1 0 1" scale="1.8 1.8 1.8"> <a-cylinder color="#5D4037" radius="0.2" height="4"></a-cylinder> <a-cone color="#2f5d50" radius-bottom="1.2" height="5" position="0 4 0"></a-cone> </a-entity>
                <a-entity position="3 0 -1" scale="1.2 1.2 1.2"> <a-cylinder color="#5D4037" radius="0.2" height="2.5"></a-cylinder> <a-cone color="#3b7960" radius-bottom="1" height="3.5" position="0 2.5 0"></a-cone> </a-entity>
            </a-entity>
        </a-entity>
        

        <!--地面-->
        <a-plane position="0 -0.05 0" rotation="-90 0 0" width="20" height="20" color="#384e36"></a-plane>
    </a-scene>

</body>
</html>
